# Static analysis and the quality gate.
#
# Deliberately separate from build.yml. This is the workflow that blocks a merge; that one
# produces the VSIX a reviewer installs to try a branch by hand. A SonarQube Cloud outage, an
# expired token or a failing gate should stop the merge without also withholding the artefact —
# and build.yml stays a build, with no secret in its environment.
#
# It repeats build.yml's build and test rather than reusing them. That is a deliberate few
# minutes: the scanner reads the lcov off the working tree, so the tests must have run in *this*
# job. The `concurrency` block below buys the time back on any branch pushed to more than once.
#
# See jpipe-vscode ADR-VSC-0009.

name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  NODEJS_VERSION: '22.22.2'

# Analysis reads the tree and reports through SONAR_TOKEN. It writes nothing to the repository.
permissions:
  contents: read

# A branch pushed to twice in a minute should be analysed once. Sonar reports against the head
# commit, so a superseded run's verdict is stale before it lands.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:

  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history. On a pull request Sonar works out what counts as "new code" from the
          # merge base, and blames every line it reports. A shallow clone gives it neither, and
          # the result is an analysis that either sees no new code or attributes all of it to
          # a single commit.
          fetch-depth: 0

      - name: Set up node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{env.NODEJS_VERSION}}'
          cache: npm

      - name: Install dependencies
        run: npm install

      # The sequence build.yml runs, in the same order — the language package's `out/` must
      # exist before its tests import it — but with coverage on, because the scanner below
      # reads the lcov this produces and cannot produce it itself.
      - name: Build and test with coverage
        run: |
          npm run clean
          npm run langium:generate
          npm run build
          npm run test:coverage

      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # The gate is the whole point of this workflow. Without this flag the scanner
          # uploads, exits 0 whatever the gate then decides, and the required check goes green
          # on a failing gate — the exact outcome this workflow exists to prevent.
          args: >
            -Dsonar.qualitygate.wait=true

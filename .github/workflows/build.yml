# workflow to produce the VS code extension

name: Build VS Code extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # Can be triggered manually

env:
  NODEJS_VERSION: '22.22.2'

# This job builds, tests and packages. It reads the tree and uploads an artefact; it needs
# nothing else, and stating so keeps a compromised dependency from being able to write here.
permissions:
  contents: read

# A branch pushed to twice in quick succession only needs its newest commit built. Cancelling
# the superseded run matters more here than it looks: this workflow and sonar.yml both run a
# full clean build on every push, so an active branch would otherwise queue four.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up node.js
        uses: actions/setup-node@v7
        with:
          node-version: '${{env.NODEJS_VERSION}}'
          cache: npm

      - name: Install vsce to package code
        run: |
          npm install -g @vscode/vsce

      # `ci`, not `install`: it installs exactly what package-lock.json records and fails when
      # the two disagree, so "it built in CI" is a claim about the tree we actually ship.
      - name: Install dependencies
        run: npm ci

      # Split out from packaging so a failure names the phase that broke, and so the
      # language package's `out/` exists before the tests import it.
      - name: Build
        run: |
          npm run clean
          npm run langium:generate
          npm run build

      # Runs both workspaces. Placed before packaging so a red test blocks the artefact
      # rather than shipping alongside it.
      - name: Run tests
        run: npm test

      - name: Package extension as VSIX artefact
        run: |
          cd packages/extension
          vsce package --no-dependencies -o jpipe-extension.vsix

      # The packaging rules and the artefact are two halves that never meet, and nothing
      # compared them until a coverage report turned up inside the VSIX. Checked in both
      # directions: a missing runtime asset installs cleanly and does not work, which is
      # worse than a fat download. See jpipe-vscode ADR-VSC-0020.
      - name: Check the VSIX contains only what it should
        run: ./scripts/check-vsix.sh packages/extension/jpipe-extension.vsix

      - name: Upload VSIX artefact
        uses: actions/upload-artifact@v7
        with:
          name: jpipe-extension-${{ github.sha }}.vsix
          path: packages/extension/jpipe-extension.vsix
          archive: false
